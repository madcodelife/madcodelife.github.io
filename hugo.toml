DefaultContentLanguage = "zh-cn"
author = "Floyd Wang"
baseURL = "https://madcodelife.com/"
locale = "zh-CN"
theme = "hugo-bearblog"
title = "11011"

enableInlineShortcodes = true
enableRobotsTXT = true

[pagination]
pagerSize = 10

# 必须写成 [permalinks.term]：扁平写法 `tags = "..."` 过去只作用于 taxonomy 词条页，
# 新版 Hugo 也会拿它去匹配普通页面，导致空文件 content/tags.md（slug 为空）
# 被解析到 /blog/，把区块列表页覆盖成空白。
[permalinks]
[permalinks.term]
tags = "/blog/:slug"

[params]
description = "越努力越幸运"
googleAnalytics = "G-N5DMQTRN38"
images = [
  'https://assets.madcodelife.com/blog/2024/11/af2307cfa5771e2e599f7d1fc7535982.jpeg',
]

[params.giscus]
category = 'General'
categoryId = 'DIC_kwDOImHxVs4CemCQ'
emitMetadata = "0"
inputPosition = 'bottom'
lang = 'zh-CN'
mapping = 'title'
reactionsEnabled = "1"
repo = 'madcodelife/madcodelife.github.io'
repoId = 'R_kgDOImHxVg'
strict = "0"
theme = 'preferred_color_scheme'

# 跑步数据在构建时远程拉取（layouts/shortcodes/running.html），
# 本地开发时缓存一天，避免每次 rebuild 都下载几 MB 的 activities.json
[caches]
[caches.getresource]
maxAge = "24h"

[markup]
[markup.highlight]
codeFences = true
lineNos = true
lineNumbersInTable = false
style = 'friendly'
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
