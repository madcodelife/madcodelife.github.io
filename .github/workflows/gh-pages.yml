# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Primary trigger for refreshing /running: madcodelife/running_page fires this
  # right after it commits new activities, so there is no guessing about when
  # upstream finishes.
  repository_dispatch:
    types: [running-data-updated]

  # Fallback in case the dispatch above never arrives.
  #
  # Deliberately late in the day: both this workflow and the upstream sync are
  # cron-scheduled, and GitHub delays scheduled runs by an unpredictable 1-2
  # hours. Upstream declares 00:00 UTC but has committed as late as 03:37, so an
  # early fallback can easily run before upstream lands and leave the page a
  # full day stale.
  schedule:
    - cron: "0 5 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --printPathWarnings \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # madcodelife.com is served by Vercel, which only builds on push. Nudge it for
  # the triggers that do not involve one, otherwise the running stats there stay
  # frozen at whatever the last commit produced.
  #
  # Skipped silently when VERCEL_DEPLOY_HOOK is absent so this workflow can be
  # merged before the secret exists.
  notify-vercel:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set; madcodelife.com will not be rebuilt."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" --output /dev/null
          echo "Vercel rebuild requested."
