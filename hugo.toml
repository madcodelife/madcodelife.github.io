author = "Floyd Wang"
baseURL = "https://madcodelife.com/"
theme = "hugo-bearblog"
title = "11011"

# 英文优先：英文挂在根路径，中文在 /zh/ 下。
# 内容按文件名区分语言，`post.md` 是英文，`post.zh.md` 是中文。
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableInlineShortcodes = true
enableRobotsTXT = true

[pagination]
pagerSize = 10

# 必须写成 [permalinks.term]：扁平写法 `tags = "..."` 过去只作用于 taxonomy 词条页，
# 新版 Hugo 也会拿它去匹配普通页面，导致空文件 content/tags.md（slug 为空）
# 被解析到 /blog/，把区块列表页覆盖成空白。
[permalinks]
[permalinks.term]
tags = "/blog/:slug"

[languages]
[languages.en]
label = "English"
locale = "en-US"
weight = 1
[languages.en.params]
description = "The harder I work, the luckier I get."
giscusLang = "en"

[languages.zh]
label = "中文"
locale = "zh-CN"
weight = 2
[languages.zh.params]
description = "越努力越幸运"
giscusLang = "zh-CN"

[params]
googleAnalytics = "G-N5DMQTRN38"
images = [
  'https://assets.madcodelife.com/blog/2024/11/af2307cfa5771e2e599f7d1fc7535982.jpeg',
]

[params.giscus]
category = 'General'
categoryId = 'DIC_kwDOImHxVs4CemCQ'
emitMetadata = "0"
inputPosition = 'bottom'
# 评论按中文标题归档（见 layouts/partials/footer.html），中英文版本共用同一个 discussion
mapping = 'specific'
reactionsEnabled = "1"
repo = 'madcodelife/madcodelife.github.io'
repoId = 'R_kgDOImHxVg'
strict = "0"
theme = 'preferred_color_scheme'

# 跑步数据在构建时远程拉取（layouts/shortcodes/running.html），
# 本地开发时缓存一天，避免每次 rebuild 都下载几 MB 的 activities.json
[caches]
[caches.getresource]
maxAge = "24h"

[markup]
[markup.highlight]
codeFences = true
lineNos = true
lineNumbersInTable = false
style = 'friendly'
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
